# .github/workflows/auto-merge-exercism.yml
name: Auto merge Exercism sync PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'exercism-solutions-syncer'
    runs-on: ubuntu-latest

    steps:
      - name: Merge Exercism PR
        run: gh pr merge "$PR_URL" --squash --auto
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
